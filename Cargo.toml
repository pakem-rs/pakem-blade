[package]
name = "pakem-blade"
version = "1.0.5"
edition = "2024"
description = "Pure, fast, and standalone Pakem Blade template engine for Rust"
license = "MIT"
repository = "https://github.com/pakem-rs/pakem-blade"
homepage = "https://pakem.my.id"
readme = "README.md"
keywords = ["pakem", "blade", "template", "laravel", "rust"]
categories = ["template-engine", "web-programming"]

[dependencies]
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
indonesian-script = "0.1.2"
